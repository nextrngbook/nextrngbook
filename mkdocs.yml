site_name: NextRNGBook Docs

theme:
  name: "material"
  features:
    - content.code.copy
  
plugins:
  - mkdocstrings
  
nav:
  - Home: index.md
  - What is New: what_is_new.md
  - Quick Start: 
      - DX generator: dx_quick_start.md
      - DX32 generator: dx32_quick_start.md
      - SAFE generator: safe_quick_start.md
      - eSAFE generator: esafe_quick_start.md
  - API Reference:
      - Overview: reference.md
      - dx_generator: dx_generator.md
      - safe_dx_pcg64: safe_dx_pcg64_generator.md
  - SAFE Reference:
      - SAFE generator: safe_generator.md
  - Evaluation: evaluation.md
  - Explanation: 
      - Team: team_and_contributor.md
  
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - toc:
      toc_depth: 2

extra_javascript:
  - javascripts/mathjax.js
